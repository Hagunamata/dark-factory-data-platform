# =============================================================================
# Logstash pipeline — dark-factory container logs → Elasticsearch
# =============================================================================
# Containers ship their stdout/stderr here via the Docker GELF log driver
# (configured per-service in docker-compose.yml under `logging:`). The
# Docker daemon attaches a `tag` field that we promote to `service` so
# Kibana visualisations can filter by component.
#
# Index pattern: darkfactory-logs-YYYY.MM.dd (one index per day, easy to
# expire via ILM in production — out of scope here).
# =============================================================================

input {
  gelf {
    port => 12201
    type => "container_log"
  }
}

filter {
  # The Docker GELF driver sets `tag` from compose's `logging.options.tag`.
  # Promote to `service` so it's the obvious filter field in Kibana.
  if [tag] {
    mutate { add_field => { "service" => "%{[tag]}" } }
  }

  # Healthcheck noise: skip the constant pg_isready / curl /health spam so
  # the dashboard isn't drowned by it. Filtering at ingest is cheap and
  # keeps Elasticsearch storage tidy.
  if [message] =~ /(?i)healthcheck|pg_isready|GET \/health/ {
    drop {}
  }

  # Best-effort JSON parsing: Airflow + Spark emit structured logs on some
  # lines. If parsing fails, the original `message` is preserved as-is.
  if [message] =~ /^\s*\{.*\}\s*$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "darkfactory-logs-%{+YYYY.MM.dd}"
    # Single-node dev cluster — no auth, no TLS.
  }
}
